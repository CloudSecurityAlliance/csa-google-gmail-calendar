[build-system]
# >=83 for CVE-2026-59890 / GHSA-h35f-9h28-mq5c, a MANIFEST exclusion bypass via Unicode
# NFC/NFD filename collision on macOS APFS/HFS+ affecting <83.0.0. This project is maintained
# on macOS and publishes to PyPI, so a file deliberately excluded from the sdist could ship
# anyway. Build-time only, so raising the floor costs consumers nothing - and it removes the
# need to rely on the release job's sdist grep, which is a compensating control rather than a
# fix. setuptools 83 and 84 both declare requires-python >=3.10, matching ours exactly. (#187)
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-google-gmail-calendar"
dynamic = ["version"]
description = "Read, compose and send Gmail, and manage Google Calendar events"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cloud Security Alliance" }]
maintainers = [{ name = "Kurt Seifried", email = "kseifried@cloudsecurityalliance.org" }]
keywords = [
    "google",
    "gmail",
    "google-calendar",
    "email",
    "calendar",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Deliberately lower-bound-only. These ranges are the PUBLISHED package's, and raising a floor
# excludes somebody on a perfectly good older release for no benefit; the 2026-07-22 audit
# settled that as "benign and standard for a library" and the 2026-08-27 one says explicitly to
# leave them permissive. Reproducibility of CI and release is a different question, tracked as
# #188 - a lockfile there, not tighter ranges here.
#
# So a floor is raised here only when a specific version fixes something:
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    # Declared even though it arrives transitively (google-auth-oauthlib -> requests-oauthlib),
    # because a transitive dependency we name no floor on is one we cannot bound: CVE-2022-36087
    # affects >=3.1.1,<3.2.2, and nothing in this file said so. It parses redirect URIs on the
    # token-acquisition path, which is not a place to accept whatever resolves.
    "oauthlib>=3.2.2",
    # Gmail bodies arrive as HTML; markdownify turns them into the Markdown this server hands
    # back, and it depends on beautifulsoup4 to parse that HTML in the first place.
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# The MCP server is an optional delivery layer; the core library never imports it.
# Floor is 2.1: `mcp.server.fastmcp` was removed in 2.0 (FastMCP -> MCPServer) and 2.x
# is where sync tool handlers run on a worker thread. Pinning lower would be fiction.
mcp = ["mcp>=2.1", 'typing_extensions>=4.0; python_version < "3.12"']
# Raised freely, unlike the runtime ranges above: nobody installing the library gets these, so
# a high floor costs nothing. And for the two that GATE CI it is not merely tidiness - `ruff`
# and `mypy` give materially different answers across majors, so a contributor on ruff 0.6 or
# mypy 1.x sees a different verdict from the one that will block their PR.
dev = ["pytest>=9.0", "pytest-cov>=7.0", "ruff>=0.16", "mypy>=2.0", "mcp>=2.1",
       'typing_extensions>=4.0; python_version < "3.12"',
       # scripts/coverage.py --markdown and tests over it parse YAML fixtures / workflow files.
       "PyYAML>=6.0"]

[project.scripts]
csa-google-gmail-calendar = "csa_google_gmail_calendar.mcp:main"

[project.urls]
Homepage = "https://github.com/CloudSecurityAlliance/csa-google-gmail-calendar"
Repository = "https://github.com/CloudSecurityAlliance/csa-google-gmail-calendar"
Issues = "https://github.com/CloudSecurityAlliance/csa-google-gmail-calendar/issues"
Changelog = "https://github.com/CloudSecurityAlliance/csa-google-gmail-calendar/blob/main/CHANGELOG.md"

# Single source of truth for the version: csa_google_gmail_calendar.__version__
# (setuptools reads it by static AST parse; no need to import the package).
[tool.setuptools.dynamic]
version = { attr = "csa_google_gmail_calendar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker so downstream mypy/pyright consume the inline type hints.
[tool.setuptools.package-data]
csa_google_gmail_calendar = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["experiments", "research", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# scripts/coverage.py predates this project's ruff gate (this file was not part of Task 1's
# scope, which only patched scripts/inventory.py:84) and uses a deliberately terse,
# analysis-script style: multiple statements per line, a lambda helper closed over a loop
# variable it calls before the loop advances, and one wide table-row f-string. Not a defect
# in behaviour; not worth restructuring a working, unimported script to satisfy a linter it
# was written before.
"scripts/coverage.py" = ["E401", "E701", "E702", "E731", "B023", "E501"]
# Embeds the official CSA logo SVG verbatim (../csa-google-workspace has the identical
# exception for its own copy of this file). It is an asset, not code, and inlining it is what
# keeps the login success page self-contained with no separate static-file serving to build.
"src/csa_google_gmail_calendar/mcp/_success_page.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# The google-api-python-client / google-auth stack ships no type stubs. Nor do markdownify
# or bs4.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.*", "google_auth_oauthlib.*", "markdownify.*", "bs4.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["csa_google_gmail_calendar"]
branch = true

[tool.coverage.report]
# Unit suite runs offline against fakes; real-Google calls and the interactive OAuth flow
# are exercised by the gated integration suite, not here - hence a threshold below 100.
# Set higher than csa-google-workspace's 85: this project targets 90 from the outset.
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
fail_under = 90
