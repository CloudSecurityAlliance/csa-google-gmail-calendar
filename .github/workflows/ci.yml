name: ci
on: [push, pull_request]

# Declared at workflow level so every job inherits it, rather than per-job on whichever one a
# scanner happens to flag - the identical reasoning csa-zendesk's own `tests.yml` states for the
# same block. Nothing here needs more than read: every job checks out, installs, and runs a
# gate. `release.yml` scopes `id-token: write` to its publish job alone and states
# `contents: read` at the top for the same reason.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor of the support promise (`requires-python = ">=3.10"`, pyproject's own
        # classifiers 3.10-3.14) tested directly, not assumed from the floor alone.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      # `fail_under = 100` already lives in pyproject.toml ([tool.coverage.report]) - repeated
      # here as `--cov-fail-under` so a change to either place is visible as a diff to the CI
      # file too, not only to the config it mirrors. A gate below the measured number cannot
      # fail (docs: 100% is the standard, and an exception is a line not a threshold); the
      # sanctioned hatch is `# pragma: no cover` on a specific line, with a reason there, not a
      # lowered number here.
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=100

  test-windows:
    name: the suite on Windows
    runs-on: windows-latest
    # Required, and deliberately NOT `continue-on-error`. The first Windows run of this
    # suite found 15 failures across five root causes (#29) while every job above was
    # green, because every job above is ubuntu. A passing ubuntu job is evidence about
    # ubuntu. A job that cannot fail would have reported the same green for the same
    # fifteen failures.
    #
    # One interpreter, not the five-version matrix: this job holds the platform axis
    # honest and the version axis is already covered above. Widen it if a
    # version-specific Windows defect ever appears.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # NO COVERAGE GATE HERE, and the reason is structural rather than a concession.
      # `auth.py` branches on `_WINDOWS` - an ACL reader and an `icacls` fallback on one
      # side, `os.fchmod`/`os.chmod` on the other - so each platform necessarily leaves
      # the other's branch unexecuted. auth.py says so itself at the `os.chmod` line: "a
      # Windows-only test run cannot reach this line at all." 100% is reachable by the
      # UNION of platforms, never by one of them, and the honest way to say that is to
      # gate coverage where the suite runs completely (the ubuntu job above) rather than
      # to set a second, lower number here. A lowered threshold is the thing this repo's
      # testing docs refuse by name; this is not one, it is a different gate. What this
      # job gates is simpler and still real: do the tests pass on Windows.
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      # Deliberately unpinned: the point is to observe what a real `pip install
      # csa-google-gmail-calendar` resolves to today, not what a pinned closure nobody installs
      # resolves to. The same gate runs on the release path (release.yml), because a CVE
      # disclosed after the last merge would otherwise ship unnoticed.
      - run: pip install -e ".[dev]" pip-audit bandit
      - run: pip-audit --skip-editable
      - run: bandit -r src
