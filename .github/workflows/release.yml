name: release

# Publishes to PyPI when a GitHub Release is published, via PyPI Trusted Publishing (OIDC, no
# stored token) with PEP 740 attestations. One-time setup and the per-release steps are in
# RELEASING.md. Actions are pinned to commit SHAs (PUBLIC-GITHUB-REPO-STANDARDS.md §4).
#
# TWO JOBS, AND THE SPLIT IS THE POINT. `build` runs every piece of third-party code involved in
# a release - pip resolving dependency ranges, pip-audit, bandit, the test suite, the build
# backend - and holds NO credential. `publish` holds `id-token: write` and runs exactly one
# action against artifacts it downloads; no project code and no dependency of ours executes in
# it. Without the split, all of that would run in the job that can mint a PyPI-audience OIDC
# token, so a compromised dependency could read the ambient token and publish arbitrary
# artifacts as `csa-google-gmail-calendar`. Same shape as `csa-zendesk`'s own `release.yml`,
# which carries the fuller reasoning and traces it back to `csa-google-workspace`'s #186.
#
# The `pypi` environment gate sits on `publish`, with the credential, which also improves the
# approval: it happens AFTER the suite and the dist guard have passed, so a reviewer approves a
# build they can see succeeded rather than one about to start.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # No `id-token` here, deliberately and load-bearingly: everything below executes
    # third-party code, and none of it can mint a publishing credential that does not exist.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Deliberately NOT pinned: pip-audit's job is to observe what a real install of this
      # package resolves to today. Auditing a pinned closure would audit the one environment
      # nobody installs.
      - name: Security gate (pip-audit + bandit, unpinned runtime closure on purpose)
        run: |
          pip install -e ".[dev]" pip-audit bandit
          pip-audit --skip-editable
          bandit -r src

      - name: Unit suite (never publish a red tag)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: The repo's own gates
        run: |
          ruff check .
          mypy

      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build

      - name: Check metadata + guard dist contents
        run: |
          twine check dist/*
          # Fail loudly if a token, a credential-shaped file, or the research/analysis
          # directories ever reach the sdist. These are currently excluded only by setuptools'
          # defaults - nothing declares the intent - so this is what actually enforces it.
          # `.py` files are excluded from the word match, and only from the word match: a test
          # file legitimately named ..._token.py must not be flagged; a secret hardcoded inside
          # a .py is bandit's and gitleaks' job, not a filename check's.
          if tar tzf dist/*.tar.gz | grep -Ev '\.py$' \
               | grep -Ei '(^|/)(analysis|research|experiments|specs|docs)/|token|credential|client_secret'; then
            echo "::error::unexpected file in sdist - refusing to publish"; exit 1
          fi

      - name: Upload the built distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error      # an empty publish would otherwise look like a success
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # protected environment - gates the publish behind approval
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC) + attestations
    # Deliberately minimal: download the artifacts and hand them to the PyPA action. No
    # checkout, so project code is not even present in the job holding the credential - which
    # is the whole property the split above buys. Adding a step here that runs anything of
    # ours, or installs anything, gives that property back.
    steps:
      - name: Download the distributions built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
